spring:
  application:
    name: sotd

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        max-tokens: 4096
        model: claude-sonnet-4-5

  mvc:
    apiversion:
      use:
        header: Api-Version

  datasource:
    primary:
      url: jdbc:postgresql://localhost:5432/users_db
      username: local_user
      password: local_password
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: hikari-primary
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 3000
        max-lifetime: 1800000
        keepalive-time: 300000

    replica:
      url: jdbc:postgresql://localhost:5433/users_db?readOnly=true
      username: local_user
      password: local_password
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: hikari-replica
        maximum-pool-size: 20
        minimum-idle: 2
        connection-timeout: 2000
        max-lifetime: 1800000
        keepalive-time: 300000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 10
    open-in-view: false  # Scope the JPA persistence context to each @Transactional method
                         # rather than keeping one open for the full HTTP request - required
                         # for ReadWriteRoutingDataSource to re-evaluate primary/replica per
                         # transaction instead of reusing a connection across several.

  flyway:
    enabled: true
    locations:
      - classpath:db/migrations

  threads:
    virtual:
      enabled: true

openweather:
  enabled: true
  limit: 1
  apiKey: ${OPENWEATHER_API_KEY}
  baseUrl: https://api.openweathermap.org

resilience4j:
  retry:
    instances:
      generic-resilience:
        max-attempts: 3
        wait-duration:
          seconds: 3
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    org.springframework.web: DEBUG
    com:
      maison:
        mabs:
          sotd:
            infrastructure:
              config:
                logging: debug
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE
            extract: TRACE