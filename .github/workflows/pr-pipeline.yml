name: PR Pipeline

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: users_db_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven wrapper
        run: mvn --version

      # ── Stage 1: Compile ───────────────────────────────────────────────────
      - name: Compile
        run: mvn clean compile -q

      # ── Stage 2: Unit tests ────────────────────────────────────────────────
      - name: Run unit tests
        run: mvn test -Dspring.profiles.active=test

      # ── Stage 3: Integration tests ─────────────────────────────────────────
      - name: Run integration tests
        run: mvn verify -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/users_db_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test

      # ── Stage 4: Package ───────────────────────────────────────────────────
      - name: Package
        run: mvn package -DskipTests -q

      # ── Stage 5: Upload artifact ───────────────────────────────────────────
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sotd-${{ github.sha }}
          path: target/*.jar
          retention-days: 7

      # ── Stage 6: Test report ───────────────────────────────────────────────
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('target/surefire-reports/*.xml') != ''
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # ── Checkstyle ─────────────────────────────────────────────────────────
      - name: Run Checkstyle
        run: mvn checkstyle:check -Dcheckstyle.config.location=/src/main/resources/checkstyle/checkstyle.xml

